# mission_supervisor 파라미터 (실차 기준, Autorace 2026)
# 실수형은 반드시 소수점 표기 (예: 5 가 아니라 5.0)
mission_supervisor:
  ros__parameters:
    control_rate: 20.0
    wheel_base: 0.2
    base_speed: 0.4            # LANE_FOLLOWING 기본 속도 (규정 권장 0.3~0.4)
    max_steer: 0.33            # 등가(자전거) 조향각 한계 [rad]. 11/13 실측: /limo/ack_cmd 0.42 -> 실제 0.33~0.348, 반경 0.57 m.
                               #   물리 한계는 양쪽 약 0.355~0.36 (ack_calib6: 0.46 에서 이미 끝, 0.51 도 0.359). 예전 0.409 는 안 나옴.
                               #   0.33 유지 = 물리 한계까지 약 0.025 남김 (11/13 사용자 결정)
    front_wheel_x: 0.10        # base_link -> 앞바퀴 축 [m]. 정지선 판정 기준점 (규정: 앞바퀴)
    cmd_angular_is_steering: false   # 실차 limo_base 는 angular.z = 각속도. (Gazebo 만 true)
    # (11/13) 실차 리모(아커만 모드)는 WeGo 아커만 드라이버 하나만: ros2 launch limo_base limo_base_ackerman.launch.py
    #   명령은 /limo/ack_cmd (AckermannDrive: speed m/s, steering_angle rad -0.42 ~ 0.42, WeGo 노션 문서).
    #   차동용 limo_base.launch.py 는 아커만 모드에서 /cmd_vel 은 받지만 odom 을 안 냄 ('Invalid motion mode' 경고),
    #   둘을 같이 켜면 같은 포트(/dev/ttyTHS1)를 같이 읽어 odom 이 안 나옴 (11/13 리모에서 확인).
    #   차동 드라이버로 돌릴 땐 런치에서 cmd_output:=twist odom_offset:=0.0
    cmd_output: ackermann
    ackermann_topic: /limo/ack_cmd
    ackermann_steer_scale: 1.25    # steering_angle = atan(축간 x 회전속도 / 속도) x 이 값. 11/13 실측(ack_calib4, IMU 회전속도):
                                   #   보낸 0.2/0.3/0.42/-0.2 -> 실제 0.154/0.237/0.338/-0.160 = 약 1.25배.
                                   #   작은 각(ack_calib5, 방향 바꾼 직후, 노이즈 +-0.01~0.02): 왼쪽 0.05/0.10/0.15 -> 0.02/0.055/0.10,
                                   #   오른쪽 -> 0.02/0.084/0.135 (왼쪽이 덜 먹음). 차선 PD 가 오차로 보정하니 1.25 하나로 둠 (11/13 사용자 결정)
    ackermann_max_steer: 0.42      # 보내는 steering_angle 한계. 드라이버(limo_ackerman_driver.cpp)는 steering_angle/1.215 를 ±0.42 로
                                   #   자름 = 메시지 ±0.51 까지 받지만, 실제 바퀴는 0.46 근처에서 끝 (ack_calib6). max_steer 0.33 x 1.25 = 0.41 이라 0.42 로 충분
    odom_center_offset_x: 0.10     # WeGo 아커만 드라이버 odom 점 = 뒷바퀴 축 가운데 -> 판단 기준점(몸통 가운데)까지 앞으로 [m]
    # (11/13) 차 위치: odom 속도 + /imu 방향 (판단 켤 때 방향 0). WeGo 아커만 odom 방향은 실제보다 30% 넘게 큼
    #   (ack_calib4: 전체 회전 IMU 105도 vs odom 136도), IMU 방향은 자이로 적분과 0.3도 안. 'odom' = /odom 그대로
    odom_heading_source: imu
    imu_topic: /imu

    lane:
      reference_distance_m: 0.5  # 차선 노드가 lateral 을 재는 차 앞 거리 (차선 노드 값과 같아야 함, 11/04 0.5)
                                 # > 0: 그 점을 Pure Pursuit 로 따라감 / 0: 예전 PD (아래 이득)
      # 미션 기준 좌표(3차선·주차)를 잡을 때 카메라 차선은 이 조건일 때만 씀. 아니면 차 위치·방향 그대로 (11/05,
      # static_run4: 3차선 안에서 카메라 차선 confidence 0.00, 방향 -24도 -> 기준 좌표가 틀어져 트랙 밖으로 감)
      frame_min_confidence: 0.3
      frame_max_heading_deg: 15.0
      # (11/11 사용자 선택) 차선 노드가 한 선만 보고 추정한 값(single_lane_estimated)은 기준 좌표에 안 씀
      #   (차선 팀원 새 방식: 한 선이면 '마지막 폭의 절반' 떨어진 경로 기준 -> 넓어진 곳에선 실제 중앙과 최대 15 cm 다름)
      frame_reject_single: true
      min_confidence: 0.1      # (11/14) valid 여도 confidence 가 이보다 작으면 조향에 안 씀 (직전 값 유지). 실차 lane_run1 지그재그
                               #   구간 conf 0.00~0.10 값의 방향이 튀어 조향 +-0.3 흔들림. 그 녹화에서 5% (지그재그 20%). 0 = 안 거름
      kp_lateral: 1.2
      kd_lateral: 0.15
      kp_heading: 0.8
      # (11/10) 기본 주행 코너 감속 (사용자 선택). 차선 방향이 corner_heading_deg 보다 틀어졌거나 확신도가
      #   corner_min_confidence 아래면 corner_speed. 조건이 풀려도 corner_hold_sec 동안 유지.
      #   차선 팀원 시험: 0.4 는 두 번째 코너 이탈, 0.2 는 통과. run3: 코너 0.5 m 전부터 확신도 0.
      corner_speed: 0.2
      corner_heading_deg: 15.0
      corner_min_confidence: 0.3
      corner_hold_sec: 1.0
      corner_single_lane: true   # (11/11 사용자 선택) 한 선 추정 프레임이어도 감속 (확신도가 높게 와도). 조향은 안 줄임
      # (11/12 사용자 선택) 차선 팀원 제안 = 예전 limo_control 식. Gazebo 첫 코너 4/4·지그재그 2/2, 실차 곡선 2곳 통과
      #   (원본 Pure Pursuit 는 실차 곡선 통과 0번. 실차 카메라 값이 아직 시뮬 값이라 lateral 의 m 단위가 안 맞음)
      # 조향 (모든 차선 추종 State): 회전속도 = pd_kp * lateral + pd_kd * (lateral 변화율), +-pd_max_omega.
      #   변화율은 새 차선 값 때만, pd_d_smooth 로 평활, pd_d_jump 넘게 튀면 버림. 조향각 변화는 초당 steer_rate_max 까지.
      #   omega_pd false = Pure Pursuit (11/04)
      omega_pd: true
      pd_kp: 4.0               # [rad/s per m] 팀원 실차 시험값 (kp = kd = 4.0, base_speed 0.2)
      # (11/12 Gazebo pd_lane_run1) 한 선 구간에서 옆오차가 0.1초마다 1 cm 씩 흔들려 D 항이 P 보다 커지고 핸들이 좌우로
      #   뒤집힘 -> kd 1 + 변화율·옆오차 평활. 같은 녹화 값으로 다시 계산: 좌우 바뀜 코너1 9->4, 지그재그 25->9, 코너2 10->2,
      #   코너에서 한쪽으로 꺾는 크기는 그대로 (0.27~0.28 rad)
      pd_kd: 1.0               # [rad/s per m/s]
      pd_d_smooth: 0.15        # 변화율 평활 (새 값 비중)
      pd_lat_tau: 0.15         # 옆오차 평활 시간 상수 [s] (0 = 안 함). 10 Hz 면 새 값 비중 약 0.5, 느린 카메라면 덜 평활
      pd_d_jump: 0.12          # 이웃 차선 값이 이만큼 넘게 다르면 변화율 버림 [m]
      pd_max_omega: 1.0        # [rad/s]
      steer_rate_max: 2.0      # 조향각 변화 한계 [rad/s]
      # 속도 (LANE_FOLLOWING 만): base_speed * max(min_ratio, 1 - |lateral| / slow_lat), 한 선 추정이면 min_ratio,
      #   최저 min_speed, 가속 accel_max / 감속 decel_max 까지. 켜면 위 corner_* 감속은 안 씀. false = corner_* 감속
      speed_by_lateral: true
      slow_lat: 0.17           # [m]
      min_ratio: 0.4
      min_speed: 0.12          # 팀원 실차: 0.08 에서 모터가 섰다 갔다 [m/s]
      accel_max: 0.4           # [m/s^2]
      decel_max: 1.0           # [m/s^2]

    failsafe:
      hold_sec: 1.0
      creep_speed: 0.12
      stop_after_sec: 5.0
      # (11/10) 저속 구간에서 직전 조향각 유지 (사용자 선택). 직선은 거의 0 이라 예전과 같고, 곡선에선 계속 돔.
      #   false = 예전처럼 직진 (run3: 코너에서 직진해 맵 밖으로 떨어짐)
      creep_keep_steer: true
      # (11/05) 예전 규정(터널)용 벽 따라가기(wall_sector_deg, wall_max_range)는 뺌 - 2026 트랙엔 벽 없음

    perception:
      stale_sec: 0.5
      debounce_count: 3
      lockout_sec: 8.0         # 미션을 마친 뒤 같은 미션 재진입 금지 시간
      exit_miss_count: 3

    yolo:
      event_range: 3.0         # 위치가 유효할 때 이 거리 안이어야 이벤트로 인정 [m]
      pedestrian_range: 1.5    # 보행자 표지판만 따로 (유도선보다 먼저 잡혀 SLOW_ZONE 을 건너뛰지 않게)
      confirm_frames: 2        # 같은 이벤트가 연속 N 프레임 검출돼야 인정 (오인식 방지)
      hold_sec: 1.0            # YOLO 결과 유지시간 (추론이 느려도 프레임 사이가 안 끊기게)
      # (11/05) 옆 길 표지판 거르기. 위치가 있으면 |y_m| 이 이 안일 때만 씀 (이벤트·거리·신호등 색 전부, LIMO 는 따로).
      #   lane_yolo_run1/run2: 위쪽 길에서 안쪽 길 신호등(오른쪽 1.15 m)·주차 표지판(1.2 m)·횡단보도(0.6~0.7 m)를 보고
      #   TRAFFIC_LIGHT·PARKING 에 잘못 들어감. 트랙 파일 기준 우리 길 표지판은 차선 중앙에서 0~0.43 m.
      max_lateral: 0.7         # 표지판·신호등·유도선 [m]
      sign_ab_max_lateral: 1.1 # A/B 표지판 (3차선 가운데 섬 앞이라 옆 차선(0.52 m)에서도 봐야 함) [m]
      crosswalk_max_lateral: 0.35  # 정지 기준 횡단보도 (가운데까지 옆 거리) [m]
      # (11/05) 정지선 = YOLO 횡단보도(줄무늬) 앞끝보다 이만큼 차 쪽. 그만큼 앞에서 선다 (신호등·보행자 둘 다).
      #   Gazebo 맵(track_paint white.dae): 오른쪽 길 정지선 y 2.491~2.507, 줄무늬 2.436 / 안쪽 길 선 x 3.202~3.226, 줄무늬 3.273
      #   -> 5~7 cm. lane_yolo_run5: 앞바퀴가 줄무늬 앞 0.4 cm 에 섬 = 정지선 6~7 cm 넘음 (규정 ±5 cm). 실제 트랙에서 재서 바꿀 것.
      crosswalk_to_stopline: 0.06

    # 미션 1 - 신호등
    traffic_light:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.0   # >0 이면 정지 직전 이 거리부터 감속 (0 = 끝까지 approach_speed)
      stop_gap: 0.03           # 앞바퀴~정지선 이 거리 이하에서 정지/통과 판정 [m]
      green_confirm_sec: 0.3   # 정지 후 초록불이 이 시간 유지되면 출발
      approach_timeout: 25.0   # 정지선 거리를 끝내 못 받으면 이 시간 뒤 현 위치에서 판정
      max_wait_sec: 10.0       # 정지 후 초록불을 이 시간 못 보면 출발 (0 = 무한 대기). 미션 Time-out 15초 안에 들도록

    # 미션 3 - 보행자 표지판
    crosswalk:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.0
      stop_gap: 0.03
      wait_sec: 4.0            # 규정: 3초 이상 대기, 15초 이내 출발
      approach_timeout: 25.0

    # 미션 5 - 서행 구간 (방지턱)
    bump:
      speed: 0.2               # 규정: 기본 속도의 1/2, 최대 0.2 m/s
      # (11/05) 끝내는 기준 시간 -> 거리. 표지판까지 거리(YOLO) + after_sign_distance 를 odom 으로 다 가면 끝.
      #   lane_yolo_run1: 표지판을 1.7 m 앞에서 보고 8초 만에 끝나 방지턱 1 m 전에 서행이 풀렸음.
      after_sign_distance: 1.8 # 표지판 -> 서행 끝 [m]. 연습 트랙(Gazebo track.json) 표지판 x 2.3 ~ 방지턱 끝 x 3.7 = 1.4
                               #   + 뒷바퀴(차 중심 뒤 0.10~0.12) + 여유 0.3. 실제 대회 트랙에서 다시 확인
      unknown_sign_distance: 2.0  # 표지판 위치를 한 번도 못 받았을 때 표지판까지 거리로 침 [m]
      duration_sec: 8.0        # odom 이 없을 때만: 진입 후 이 시간 뒤 끝 (예전 방식)
      max_duration: 30.0       # 무슨 일이 있어도 이 시간 뒤 끝 [s]

    # 미션 6 - 서행 유도선 (지그재그)
    slow_zone:
      speed: 0.2
      lock_offset: 0.0         # 유도선 시작점에 도달한 뒤 이만큼 더 가서 헤딩 고정 [m]
      lock_delay_sec: 1.0      # 유도선 거리를 모를 때만: 진입 후 이 시간 뒤 헤딩 고정
      k_yaw: 1.5               # 고정 헤딩 유지 게인
      lane_blend: 0.3          # 차선 보정 비율 (0 = 순수 헤딩 유지, 1 = 일반 차선 추종 세기)
      handoff_stopline: 0.5    # 보행자 표지판을 본 뒤 정지선이 이 거리 안이면 CROSSWALK_STOP 으로 [m]
      handoff_sign: 1.0        # 정지선이 아직 안 보이면 표지판이 이 거리 안일 때 (0 = 끔) [m]
      max_duration: 20.0       # 보행자 표지판을 끝내 못 보면 이 시간 뒤 복귀

    # 미션 2 - 갈림길 A/B
    left_a_right_b:
      trigger_distance: 0.8
      approach_speed: 0.25
      shift_speed: 0.25
      lane_width: 0.50         # 트랙 도면 차선 폭 500 mm
      shift_duration: 2.5
      settle_sec: 1.0
      approach_timeout: 10.0
      max_duration: 20.0
      use_lane_context: true   # AVOID_STATIC 에서 이어받으면 odom 모드 (3차선 차선 번호 사용)
      a_lane: 0                # odom 모드: A(좌) 경로 차선 (0 왼쪽, 1 가운데, 2 오른쪽)
      b_lane: 2                # odom 모드: B(우) 경로 차선
      odom_hold_distance: 0.6  # 목표 차선 도착 후 이만큼 더 간 뒤 종료 [m]
      # (11/13) 카메라 방식(3차선 정보 없을 때)에서 옆으로 옮기는 중, 차선 노드가 '지금 들어간 차선' 가운데로 바꿔 주면
      #   lateral 이 차선 폭만큼 튐 (왼쪽 차선으로 바뀌면 +폭). 그 횟수만큼 목표 이동량에서 빼서 한 차선 더 가지 않게 함.
      #   차선 노드 약속 (11/13 팀원 답변): 항상 '차가 지금 들어가 있는 차선' 가운데 기준
      lane_jump: true
      jump_max_gap: 1.0        # 이 시간 안의 연속 차선 값끼리만 비교 [s]
      jump_wait_sec: 3.0       # (11/14) settle 뒤 차선 노드 기준이 새 차선으로 안 바뀌었으면 최대 이만큼 더 옮기며 기다림 [s]
                               #   (기본값으로 끝날 때 옆 0.28 m 라 점선 0.26 m 를 겨우 넘음, 못 넘고 끝나면 처음 차선으로 돌아감)

    # 미션 7 - 정적 장애물 회피 (3차선, LIMO 7대). 차선 번호: 0 왼쪽, 1 가운데, 2 오른쪽
    avoid_static:
      trigger_distance: 1.2    # 라이다: 진행 경로 앞 이 거리 안 장애물이면 진입 [m]
      trigger_half_width: 0.3  # 진행 경로 폭의 절반 (옆에 선 주차 구역 LIMO 는 무시) [m]
      yolo_range: 1.5          # YOLO LIMO 는 이 거리 안 + 경로 폭 안일 때만 [m]
      lidar_trigger: true
      # (11/12 사용자 선택) 코너 도는 중엔 라이다 진입 미룸 (Gazebo pd_lane_run1/2: 코너 20도 남기고 진입 -> 차 방향
      #   -160도를 기준으로 잡아 바깥 선 위까지 감). odom 회전 속도가 이 값 넘으면 기본 주행 계속, 잦아들면 진입.
      #   단 장애물이 defer_min_distance 안이면 바로 진입. 0 이면 안 미룸
      defer_turn_rate_deg: 10.0   # [도/s]
      defer_min_distance: 0.5     # [m]
      # (11/14) 카메라 차선을 기준 좌표로 못 쓸 때 차 방향이 트랙 축에서 이만큼 넘게 틀어져 있으면 미룸 (장애물이 defer_min_distance
      #   안이면 바로). 실차 lane_run1: 코너를 빠져나오며 축에서 9도 틀어진 채 진입 -> 기준 좌표가 0.2~0.3 m 옆 -> 바깥 선 위. 0 = 안 미룸
      defer_axis_deg: 5.0         # [도]
      min_obstacle_radius: 0.10  # 라바콘(작음)과 구분 [m]
      max_obstacle_radius: 0.40
      start_lane: 1            # 3차선은 항상 가운데에서 시작
      lane_width: 0.52         # 차선 중앙 간격 (도면: 차선 500 + 점선 20 mm)
      speed: 0.25
      lookahead: 0.45          # 차선 따라가기 Pure Pursuit 거리 [m]
      lookahead_short: 0.25    # 보통(lookahead)으로 굴려서 막히면 이걸로 급하게 꺾어 봄 (0 이면 안 씀) [m]
      plan_horizon: 1.8        # 후보 차선(가운데 3곳)마다 이 거리만큼 미리 굴려 보고 충돌 검사 [m] (감속·정지 판단)
      plan_depth: 2            # 2: 그 차선으로 가다가 옆 차선으로 한 번 더 옮기는 길까지 봄 (1 = 차선 하나만, 11/04 까지 방식) (11/05)
      plan_horizon_long: 3.0   # plan_depth 2 일 때 굴려 보는 거리 [m]
      switch_step: 0.3         # 이 거리마다 '여기서 옆 차선으로 옮기면' 을 굴려 봄 [m]
      switch_margin: 0.15      # 목표 차선은 이만큼 더 멀리 갈 수 있을 때만 바꿈 [m]
      switch_hold: 1.0         # 목표 차선을 바꾼 뒤 이 시간은 유지 (지금 목표가 곧 막히면 예외) [s] (11/12: 0.5 -> 1.0)
      # (11/12) 차선 바꾸기 확정: true 면 목표 차선에 들어가기 전엔 목표 고정 (목표가 commit_distance 안에서 막히고
      #   switch_hold 지났을 때만 다시 고름). Gazebo pd_lane_run4 (두 칸 점프 + 0.15초 만에 목표 뒤집힘) 때문에 넣어 봤지만
      #   0.55 배치는 계속 다시 골라야 빠져나가는 경우가 있어 run.py 4개가 막힘 -> 기본 false.
      #   '바로 옆 차선만 목표' 는 0.55 배치(가운데 LIMO 사이를 대각선으로 가로질러야 함)에서 40번 중 2번 성공이라 코드에 안 넣음
      lane_commit: false
      lane_from_odom: true     # 바꾸는 중에도 차선 번호는 odom 위치 (pd_lane_run4: 가운데~오른쪽에 있는데 계속 '왼쪽') (11/12)
      edge_check: true         # 굴려 볼 때 3차선 바깥 선을 넘으면 막힌 것으로 봄 (바퀴 기준)
      edge_margin: 0.0         # 바깥 선(1.5 x lane_width)에 더하는 여유 [m]
      limo_length: 0.322       # 장애물 LIMO 박스 (진행방향 길이 x 폭) [m]
      limo_width: 0.22
      car_length: 0.322        # 우리 차
      car_width: 0.22
      wheel_box_length: 0.0    # 바퀴 네 개를 감싼 사각형도 따로 검사 (0 이면 안 씀. 실차는 몸통이 바퀴를 다 덮어서 안 씀) [m]
      wheel_box_width: 0.0
      clearance: 0.03          # 장애물 박스에 더하는 여유 [m]
      # (11/12 사용자 선택) 지금 자리에서 이미 여유 박스(LIMO + clearance)와 겹친 LIMO 는, 지금 안 겹칠 만큼 + 2 cm 만 여유를 줄여서
      #   굴려 보기·후진에 씀 (진짜 크기보다 overlap_extra 까지). 그 LIMO 에 지금보다 2 cm 넘게 가까워지는 길은 그대로 막힘.
      #   Gazebo static_run6: 진짜 틈 2.6 cm 인데 여유 1.5 cm + 지도 오차 2 cm 로 '이미 닿음' -> 모든 길 0 m, 후진도 못 해서
      #   제한시간까지 22초 정지 (제한시간 뒤 차선 주행으로 그냥 빠져나감). false = 예전
      overlap_relax: true
      overlap_extra: 0.03      # 지도 오차 몫 [m]
      overlap_slack: 0.02      # 안 겹칠 만큼에 더 줄이는 몫 = 지금보다 이만큼은 가까워져도 됨 (방향 틀 때 차 뒤쪽이 옆으로 돎) [m]
      commit_distance: 0.9     # 고른 차선으로 이 거리도 못 가면 감속 [m]
      slow_speed: 0.10         # 그때 감속 속도
      stop_distance: 0.25      # 그래도 이 거리 안에서 닿게 되면 정지 [m] (backup_after 지나면 후진)
      backup_after: 1.0          # 이만큼 서 있으면 후진 [s] (11/04, 사용자 요청)
      backup_distance: 0.20      # 한 번에 후진하는 거리 [m] (뒤에 LIMO 가 있으면 그 전까지만)
      backup_speed: 0.10         # 후진 속도 [m/s]
      backup_max: 3              # 한 미션에 후진하는 최대 횟수
      backup_k_heading: 1.5      # 후진하며 차 방향을 차선 방향으로 펴는 게인
      settle_tolerance: 0.08   # 목표 차선 중앙 +- 이 안이면 변경 완료 [m]
      settle_heading: 0.20     # ... 그리고 방향 오차가 이 안 [rad]
      merge_distance: 0.20
      confirm_hits: 2
      map_average: true        # LIMO 위치 = 지금까지 본 것의 평균. false 면 예전 방식(새 값 쪽으로 0.3씩) (11/04)
      ghost_min_hits: 5        # 이만큼 본 LIMO 박스와 겹치는 새 검출은 버림 (LIMO 끼리 겹칠 수 없음, 0 = 안 함)
      ghost_margin: 0.05       # 겹침 판정 때 박스 길이·폭에 더하는 값 [m]
      exit_clear_distance: 0.8 # 마지막 장애물을 지나 이만큼 더 가면 종료 [m]
      max_distance: 7.0        # 진입 후 최대 주행거리 (3차선 직선 5.5 m) [m]
      max_duration: 40.0
      context_timeout: 5.0     # 끝난 뒤 이 시간 안에 A/B 가 오면 차선 번호를 넘겨줌 [s]
      # (11/12 사용자 선택) 카메라를 못 믿어 차 방향을 기준으로 쓸 때 트랙 축(axis_ref_deg + 90도 단위)에서
      #   axis_snap_max_deg 안이면 그 축으로 맞춤 (pd_lane_run3: 코너 16도 덜 돈 채 진입 -> 바깥 선 위).
      #   가정: 트랙은 직각, odom yaw 0 = 출발 직선 방향 (출발선에 똑바로 놓고 odom 켜기)
      axis_snap: true
      axis_ref_deg: 0.0
      axis_snap_max_deg: 30.0
      # (11/12 사용자 선택) 차 방향 기준일 때 옆 위치(d = 0)도 차 위치라, 차가 차선 가운데에서 비켜 있으면 세 차선이 다 밀림
      #   (pd_lane_run4: 11 cm). 차 앞 lat_snap_range 안에서 확실히 본 LIMO 가 lat_snap_min_items 대 이상이고,
      #   '차선 가운데에서 비킨 값'이 lat_snap_spread 안에 절반 넘게 모이면 그 평균만큼 옆으로 한 번 옮김.
      #   lat_snap_max 넘으면 어느 차선인지 애매해서 안 옮김. 카메라 차선으로 기준 잡았을 땐 안 씀.
      #   가정: LIMO 는 차선 가운데에 서 있음 (연습 배치는 그럼, 대회 배치는 확정 아님)
      lat_snap: true
      lat_snap_min_items: 2
      lat_snap_spread: 0.08    # [m]
      lat_snap_max: 0.20       # [m]
      lat_snap_range: 2.0      # [m] 멀리서 처음 본 LIMO 는 옆으로 17~27 cm 틀린 적 있음 (pd_lane_run4)
      gap_speed: 0.12          # odom 이 없을 때만 쓰는 비상 주행 (빈 공간 따라가기)
      gap_range: 1.5
      gap_gain: 1.0
      robot_width: 0.30

    # 미션 8 - 라바콘
    cone:
      speed: 0.25
      creep_speed: 0.10
      lookahead: 0.45          # 게이트 중점을 이은 선 위에서 이만큼 앞 점을 따라감 [m]
      curve_gain: 0.35
      roi_min_x: 0.05
      roi_max_x: 2.0
      roi_max_y: 1.0
      max_radius: 0.18
      pair_max_dx: 0.45
      pair_max_angle_deg: 45.0   # 게이트 두 콘을 이은 선이 차 옆방향에서 이만큼 넘게 틀어지면 같은 줄 콘으로 봄
      min_gate_width: 0.30
      side_offset: 0.22
      robot_width: 0.22
      max_duration: 40.0
      # 미리 굴려보기 (11/02): 게이트 길을 옆으로 옮긴 후보들을 굴려서 차 몸통이 콘에 안 닿는 것 중 가운데에 가까운 것
      use_rollout: true          # false = 예전 방식 (게이트 선 위 lookahead 점 Pure Pursuit)
      horizon: 1.0               # 굴려보는 거리 [m]
      offset_max: 0.16           # 길을 옆으로 옮겨 보는 최대 [m]
      offset_step: 0.04          # 옮기는 간격 [m]
      car_length: 0.322          # 검사하는 차 몸통 (실차 LIMO)
      car_width: 0.22
      clearance: 0.02            # 라이다 콘 반지름에 더하는 여유 [m]
      lookahead_short: 0.25      # 후보: 짧게 보고 꽉 꺾어 도는 길 [m] (11/04, 0 = 안 씀)
      lookahead_long: 0.60       # 후보: 길게 보고 부드럽게 가는 길 [m] (0 = 안 씀)
      w_lookahead: 0.1           # 기본 lookahead 와 다른 만큼 벌점
      tight_speed: 0.15          # 안 닿는 길이 없을 때 속도 [m/s] (멈추지 않고 덜 닿는 쪽으로. 0.05 는 기어가다 40초 넘김 - 11/04 녹화)
      w_offset: 1.0              # 길을 옆으로 옮긴 만큼 벌점 (가운데 선호)
      w_margin: 1.0              # 콘과 여유 보너스 (margin_cap 까지)
      margin_cap: 0.10
      steer_rate_deg: 0.0        # 바퀴 조향 속도 흉내 [도/s]. 0 = 바로 바뀜 (실차 실측 전)
      memory_merge: 0.10         # 같은 콘으로 볼 거리 [m]
      memory_behind: 0.6         # 차 뒤로 이만큼 지나간 콘은 잊음 [m]
      # 게이트를 못 만들 때(한쪽 콘만 보이거나 짝이 안 맞음): 많이 보이는 쪽 콘 2개 선과 평행 + 반폭 거리 유지
      side_use_rollout: true     # 한쪽 줄 -> 통로 반폭만큼 옮긴 가상 가운데 길을 미리 굴려보기로 따라감
                                 # false: 차선 따라가기식 조향 (side_kp_*)
      side_kp_lateral: 1.2       # 옆 오차 게인 (차선 주행과 같은 값)
      side_kp_heading: 0.8       # 방향 오차 게인
      side_half_width: 0.36      # 게이트를 한 번도 못 봤을 때 통로 반폭 [m] (보면 그 폭의 절반을 씀)
      side_max_step: 0.62        # 같은 줄 다음 콘으로 볼 최대 거리 [m]
      side_max_turn_deg: 60.0    # 같은 줄 다음 콘은 지금 줄 방향에서 이 각도 안 (건너편 콘은 거의 90도라 빠짐)
      pass_margin: 0.10          # 라이다에서 콘이 다 빠져도, 마지막 게이트 선을 앞바퀴가 이만큼 더 지날 때까지 구간 유지 [m]

    # 미션 4 - T자 주차 (2026: 진행방향 오른쪽 칸, 양옆 LIMO, 전면 진입)
    parking:
      search_speed: 0.15
      final_speed: 0.08
      min_speed: 0.04
      turn_speed: 0.10
      turn_radius: 0.65        # 계획 회전반경. 실제 최소보다 조금 크게 [m]. (11/13) 실측 최소 0.57 m (max_steer 0.33 -> 0.58 m),
                               #   예전 0.50 은 실제로 못 돎. 0.65 = 공칭 조향 0.30 rad, 한계까지 0.03 rad 여유 (예전 0.50/0.409 와 같은 여유)
      k_radial: 2.0            # 원호 오차 보정 게인
      bay_pitch: 0.52          # 칸 간격 (칸 500 + 선 20 mm)
      pitch_tolerance: 0.22    # LIMO 쌍 간격(2 x pitch) 허용 오차 [m]
      pair_d_tolerance: 0.25
      bay_d_min: -0.95         # 윗줄 칸 LIMO 만 보는 범위 (차선 중앙 기준, 왼쪽 +) [m]
      bay_d_max: -0.30
      park_depth: 0.57         # 차선 중앙 -> 칸 깊이 가운데 (차선 반폭 0.25 + 선 0.02 + 칸 반 0.30) [m]
      # (11/10) 칸 깊이 목표 = LIMO 두 대 가운데 (기준 방향이 틀어져도 맞음. Gazebo parking_run1 에서 차선 기준은 10 cm 더 들어감)
      #   차선 기준(park_depth)과 depth_max_diff 넘게 다르면 둘의 중간 + 경고. false = 예전처럼 차선 기준만
      limo_depth: true
      depth_max_diff: 0.15     # LIMO 가 칸 안이면 칸 가운데서 최대 (0.6 - 0.322)/2 = 0.14 m 벗어남 [m]
      min_obstacle_radius: 0.05
      max_obstacle_radius: 0.40
      merge_distance: 0.20
      confirm_hits: 2
      gap_confirm: 3
      gap_match: 0.15
      # (11/14) 칸 찾기: 모든 두 LIMO 쌍에서 2 x bay_pitch 간격인 쌍 (실차 park_real1: 새 배치 윗줄 LIMO-빈칸-LIMO + 아랫줄 3대에서
      #   라이다가 빈칸 너머 아랫줄 LIMO 를 깊이 -0.91 로 보고, 깊이 0.5 m 박스를 둘로 봐서 바로 옆끼리 짝짓기가 실패).
      #   칸이 빈 건 쌍 깊이에서 slot_block_d 안에 칸 안쪽 물체가 없을 때. false = 예전 바로 옆끼리만
      any_pair: true
      slot_block_d: 0.15       # any_pair: 쌍 깊이에서 이 안에 칸 안쪽 물체가 있으면 찬 칸 (빈칸 너머 아랫줄 LIMO 는 0.3 m 넘게 깊음) [m]
      slow_distance: 0.15      # 회전 시작점 이 거리 앞부터 final_speed [m]
      overshoot_tolerance: 0.04
      heading_tolerance: 0.05  # -90도에서 이 안이면 회전 끝 [rad]
      k_heading: 1.5
      k_lateral: 2.0
      k_long: 1.0
      stop_tolerance: 0.02
      search_timeout: 30.0
      search_distance: 6.0
      turn_timeout: 15.0
      align_timeout: 15.0

    debug:
      enabled: true            # 대회 때는 false

# yolo_detector_node — Gazebo 시뮬레이션용 (2026: KUDOS_Autorace2026_Gazebo competition.launch.py 기준)
# 실차는 yolo_detector.yaml 사용

yolo_detector_node:
  ros__parameters:
    weights: "best.pt"               # 실행 시 -p weights:=/절대경로/best.pt 로 지정 권장

    image_topic: "/rgb/image_raw"          # [확인] ros2 topic list
    camera_info_topic: "/rgb/camera_info"
    depth_topic: "/depth_camera/depth/image_raw"        # Gazebo 깊이는 컬러와 같은 센서라 정렬되어 있음

    base_frame: "base_link"
    ground_frame: "base_footprint"
    camera_frame: "depth_link"       # 헤더의 depth_camera_frame_optical 은 TF 에 없어서 대신 사용
    camera_frame_is_optical: true

    rate_hz: 10.0                    # Gazebo 카메라가 10Hz
    imgsz: 640
    device: "0"
    half: false

    conf_default: 0.5
    conf_per_class: ["marker_left:0.7", "marker_right:0.7", "sign_a:0.7", "sign_b:0.7"]  # A/B 좌우 바뀌면 즉시 실패 → 높게

    # 2026 시뮬(kudos_arena) 실제 크기 (m): 원형 표지판 그림 지름 0.224, 삼각 표지판(보행자·방지턱) 높이 0.25, 신호등 본체 높이 0.205
    object_height_m: ["marker_left:0.224", "marker_right:0.224", "parking_sign:0.224", "pedestrian_sign:0.25", "slow_sign:0.224", "bump_sign:0.25", "traffic_light:0.205"]

    max_depth_m: 3.0
    ema_alpha: 0.5
    ema_reset_sec: 0.5
    edge_reject_px: 4               # 화면 가장자리에 잘린 A/B/P 박스 버림 (0 = 끔)
    light_s_min: 90                 # 신호등 색: 켜진 램프 최소 채도 [실차 튜닝]
    light_method: "hue"            # 시뮬: 램프 색상 투표 (11/5 점검 빨강 15/15)
    light_v_min: 150                #             최소 밝기 [실차 튜닝]
    light_check: true               # 신호등 모양 검사 (광고 모니터 대응, 11/4). 끄면 예전처럼 conf 최고 1개
    light_aspect_min: 1.2           # 박스 세로/가로 (실물 20.5/12 = 1.71)
    light_aspect_max: 3.0
    light_h_min_m: 0.13             # 깊이로 구한 실제 높이 (m). 실물 0.205
    light_h_max_m: 0.30
    publish_debug: true

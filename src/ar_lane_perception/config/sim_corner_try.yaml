# 시험용 (기본값 아님): 첫 코너(x ~ 8.5)에서 차선을 놓치는 문제 실험. 2026-11-07 가제보 폐쇄루프.
#   LANE_EXTRA=$HOME/scalecar2026/full_test/src/ar_lane_perception/config/sim_corner_try.yaml scripts/sim_up.sh hls
# 기본 설정에서는 코너 입구 프레임이 한쪽 선만 남아(굽은 안쪽 선은 덩어리 방향 검사로 지워지고 화각 밖으로 나감)
# single_no_history / low_confidence 로 invalid -> 코너 통과 0/12 (단순 제어기·판단 모두).
# 이 세 값을 풀면 오른쪽으로 꺾는 방향(-30 ~ -48도)이 valid 로 나가 0.2 m/s 에서 2/3 통과 (판단 0.2 / 단순 0.2 각 3회).
# 대신 옆 도로 선 오검출을 막던 가드가 꺼진다 -> 출발~방지턱 구간 재검증 전에는 기본값으로 쓰지 말 것.
camera_perception_node:
  ros__parameters:
    blob_angle_max_deg: 90.0   # 굽은 안쪽 선 덩어리를 지우지 않음 (기본 30)
    guard_need_pair: false     # 한쪽 선만 있는 프레임도 직전 값 없이 valid (기본 true)
    min_confidence: 0.0        # confidence 하한 끔 (기본 0.05)

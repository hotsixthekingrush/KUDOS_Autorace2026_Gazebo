# Gazebo 검증용: 기존 시뮬 노란색 기준값(LAB)만. step0_lab.yaml / safe3_lab.yaml 뒤에 덧씌운다.
#   lane_extra:=<step0_lab.yaml>,<sim_lab.yaml>
camera_perception_node:
  ros__parameters:
    color_space: lab
    lab_l_min: 100
    lab_l_max: 255
    lab_a_min: 90
    lab_a_max: 140
    lab_b_min: 175
    lab_b_max: 255
    # 카메라: 시뮬 값 (safe3_* / step0_* 의 실차 카메라 값을 덮어씀. 11/13 실차 값 확정 뒤 추가)
    focal_px: 381.0
    cam_height_m: 0.21
    cam_pitch_rad: 0.0
    center_x: 320
    cam_x_m: 0.10
    y_top: 320             # 시뮬 탐색 줄 범위 (safe3_* / step0_* 의 실차 값 260 / 405 를 덮어씀)
    y_bot: 470
    odom_yaw_source: odom  # (11/14) Gazebo odom 방향은 정확 -> /odom pose 그대로 (safe3_* 는 실차용 imu)
    # --- 흔들림 줄이기: 가제보 값 (카메라 잡음이 작음. 가제보 기록에서 고른 S4: 흔들림 -25%, 지연 0.3 프레임)
    kf_q_lat: 0.005
    kf_q_head: 0.08
    kf_r_lat: 0.03
    kf_r_head: 0.12

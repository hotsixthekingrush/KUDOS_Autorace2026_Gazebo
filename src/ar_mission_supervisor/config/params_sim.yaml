# Gazebo 시뮬레이터용 덮어쓰기 값.
# params.yaml 을 먼저 읽고, 여기 적힌 항목만 교체된다.
mission_supervisor:
  ros__parameters:
    use_sim_time: true

    wheel_base: 0.24          # Gazebo 모델 앞뒤 바퀴 x = +-0.12 (실차 0.2)
    max_steer: 0.5236         # Gazebo ackermann 플러그인 조향 한계 30도
    front_wheel_x: 0.12       # Gazebo 모델 앞바퀴 x
    cmd_angular_is_steering: true   # Gazebo 아커만 플러그인은 angular.z 를 조향각으로 씀 (11/02 녹화·플러그인 코드로 확인)
    lane:
      # (11/12) kp 는 팀원 Gazebo 시험값 5.5 (base_speed 0.4, 첫 코너 4/4, 지그재그 2/2).
      #   kd 는 팀원 값 5.5 로 pd_lane_run1 에서 한 선 구간 핸들이 좌우로 뒤집혀 params.yaml 의 1.0 을 그대로 씀
      pd_kp: 5.5

    # 주차 turn_radius(0.50)는 시뮬 최소회전반경(0.24 / tan(30도) = 0.416)보다 커서 그대로 씀

    # (11/03) Gazebo 조향 수정(팀원 dc84411) 뒤 녹화로 재보니 조향이 초당 약 55도 (예전 3.4도).
    # 그래서 11/02 임시 라바콘 설정(speed 0.10, max_duration 90, steer_rate_deg 3.4)은 지움 -> 실차 값 그대로.

    cone:
      # (11/04) Gazebo 차 충돌 상자가 좌우 0.31 m 라 (실차 0.22, Gazebo 파일은 안 고침) 시뮬에서만 판단도 0.31 로 검사
      car_width: 0.31
      # Gazebo 조향은 초당 약 55도 (11/03 녹화). 굴려볼 때 이걸 흉내 내면 콘 놓칠 때 더 나음 (11/04 계산)
      steer_rate_deg: 55.0

    bump:
      # (11/05) Gazebo 방지턱은 0.2 m/s 로 넘으면 차가 오르막에서 0.03 m/s 로 기다가 꼭대기에서 튕겨 나감
      # (bump_test1 방향 10도, lane_yolo_run2 88도 꺾임, 판단 명령은 0.2 직진). 0.4 는 부드럽게 넘음 (lane_run1).
      # Gazebo 물리 문제로 보여 시뮬에서만 0.4 (사용자 선택). 실차는 params.yaml 0.2 그대로.
      speed: 0.4

    avoid_static:
      # (11/04) 정적 장애물에서 옆을 긁던 문제. Gazebo 차 충돌 모양 그대로 검사 (Gazebo 파일은 안 고침):
      #   몸통 상자 앞뒤 0.19 x 좌우 0.31 (limo_car/gazebo/ackermann.xacro base_x/y_size, 실차는 0.322 x 0.22)
      #   + 바퀴 네 개를 감싼 사각형 0.33 x 0.258 (축간 0.24 + 바퀴 지름, 윤거 0.168 + 바퀴 폭 x 2)
      car_length: 0.19
      car_width: 0.31
      wheel_box_length: 0.33
      wheel_box_width: 0.258
      # 여유 0.03 이면 Gazebo 월드 배치(0.55 m 간격)에서 3대 지나고 막힘 -> 0.015 (계산: 7/7, Gazebo 모양 틈 2.4 cm)
      clearance: 0.015

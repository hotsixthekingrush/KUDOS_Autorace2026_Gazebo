# safe3 + 실차 노란색(HLS). 기존 safe3.yaml 과 같은 규칙 구성 (fork, 시작 확인, odom 예측 켬) + 차선 폭 실측(lane-rt-width).
# 쓰는 법: camera_perception.launch.py lane_extra:=<이 파일>   (Gazebo 는 lane_extra:=<이 파일>,<sim_hls.yaml>)
camera_perception_node:
  ros__parameters:
    # --- 거절 규칙: safe3 (fork_enable, confirm_head_rad, predict_enable 만 켬)
    clean_enable: false
    white_enable: false
    guard_need_pair: false
    single_tol_m: 0.0
    fork_enable: true
    confirm_head_rad: 0.035
    predict_enable: true
    predict_max_sec: 1.0         # 예측(마지막 valid 차선을 odom 으로 옮긴 값) 최대 유지 시간 [s]
    predict_confidence: 0.25     # 예측 중 confidence
    corner_outer_offset_m: 0.0   # (다) 코너 한 선 프레임에서 바깥 선으로부터 거리 [m]. 0 = 끔. 실차 0.30~0.35 시험용
    min_confidence: 0.0

    # --- 노란색: 실차에서 추출한 값 (HLS: H12-30, L90-210, S50-255)
    color_space: hls
    lane_h_l: 12
    lane_h_h: 30
    lane_l_l: 90
    lane_l_h: 210
    lane_s_l: 50
    lane_s_h: 255

    # --- 차선 폭 실측 / 고정 폭 (코드 기본값과 같음. 조정용으로 적어 둠)
    width_min_m: 0.40
    width_max_m: 0.95
    width_max_step_m: 0.03
    width_stale_sec: 30.0        # 실측 폭 기억 만료 시간 [s] (코드 기본 3.0)
    lane_width_default_m: 0.50   # (가) 실측 없음 / width_stale_sec 넘게 지남
    lane_width_corner_m: 0.0     # (나) 곡선 보정 끔 (0 = 기억한 실측 폭 그대로). 켜려면 0.75
    single_confidence: 0.5
    pair_return_rate_mps: 0.3    # 한 선 -> 두 선 전환 때만

    # --- 카메라 값: 실차 확정 (11/13, 직선 50 cm 차선이 0.51 m 로 재짐). Gazebo 는 sim_hls.yaml / sim_lab.yaml 이 시뮬 값으로 덮어씀
    focal_px: 489.6
    cam_height_m: 0.20
    cam_pitch_rad: 0.15
    center_x: 312          # 처음 시작할 때 좌/우 선을 가르는 기준 (영상 가운데)
    cam_x_m: 0.10          # 실차 미측정 (시뮬 값 그대로)
    horizon_y: 260         # 실차 값 미확정 (지금 코드는 쓰지 않음)

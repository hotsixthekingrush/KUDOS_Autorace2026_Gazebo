# mission_supervisor 파라미터 (실차 기준, Autorace 2026)
# 실수형은 반드시 소수점 표기 (예: 5 가 아니라 5.0)
mission_supervisor:
  ros__parameters:
    control_rate: 20.0
    wheel_base: 0.2
    base_speed: 0.4            # LANE_FOLLOWING 기본 속도 (규정 권장 0.3~0.4)
    max_steer: 0.409           # 등가 조향각 한계. LIMO 드라이버 안쪽바퀴 최대 28도(0.49 rad) -> R_min 약 0.46 m (실측 전)
    front_wheel_x: 0.10        # base_link -> 앞바퀴 축 [m]. 정지선 판정 기준점 (규정: 앞바퀴)
    cmd_angular_is_steering: false   # 실차 limo_base 는 angular.z = 각속도. (Gazebo 만 true)

    lane:
      kp_lateral: 1.2
      kd_lateral: 0.15
      kp_heading: 0.8

    failsafe:
      hold_sec: 1.0
      creep_speed: 0.12
      stop_after_sec: 5.0
      wall_sector_deg: 30.0
      wall_max_range: 0.8

    perception:
      stale_sec: 0.5
      debounce_count: 3
      lockout_sec: 8.0         # 미션을 마친 뒤 같은 미션 재진입 금지 시간
      exit_miss_count: 3

    yolo:
      event_range: 3.0         # 위치가 유효할 때 이 거리 안이어야 이벤트로 인정 [m]
      pedestrian_range: 1.5    # 보행자 표지판만 따로 (유도선보다 먼저 잡혀 SLOW_ZONE 을 건너뛰지 않게)
      confirm_frames: 2        # 같은 이벤트가 연속 N 프레임 검출돼야 인정 (오인식 방지)
      hold_sec: 1.0            # YOLO 결과 유지시간 (추론이 느려도 프레임 사이가 안 끊기게)

    # 미션 1 - 신호등
    traffic_light:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.0   # >0 이면 정지 직전 이 거리부터 감속 (0 = 끝까지 approach_speed)
      stop_gap: 0.03           # 앞바퀴~정지선 이 거리 이하에서 정지/통과 판정 [m]
      green_confirm_sec: 0.3   # 정지 후 초록불이 이 시간 유지되면 출발
      approach_timeout: 25.0   # 정지선 거리를 끝내 못 받으면 이 시간 뒤 현 위치에서 판정
      max_wait_sec: 10.0       # 정지 후 초록불을 이 시간 못 보면 출발 (0 = 무한 대기). 미션 Time-out 15초 안에 들도록

    # 미션 3 - 보행자 표지판
    crosswalk:
      approach_speed: 0.2
      min_speed: 0.08
      slowdown_distance: 0.0
      stop_gap: 0.03
      wait_sec: 4.0            # 규정: 3초 이상 대기, 15초 이내 출발
      approach_timeout: 25.0

    # 미션 5 - 서행 구간 (방지턱)
    bump:
      speed: 0.2               # 규정: 기본 속도의 1/2, 최대 0.2 m/s
      duration_sec: 8.0        # 표지판을 처음 본 순간(BUMP 진입)부터 센다 (10/29 5 -> 8초)

    # 미션 6 - 서행 유도선 (지그재그)
    slow_zone:
      speed: 0.2
      lock_offset: 0.0         # 유도선 시작점에 도달한 뒤 이만큼 더 가서 헤딩 고정 [m]
      lock_delay_sec: 1.0      # 유도선 거리를 모를 때만: 진입 후 이 시간 뒤 헤딩 고정
      k_yaw: 1.5               # 고정 헤딩 유지 게인
      lane_blend: 0.3          # 차선 보정 비율 (0 = 순수 헤딩 유지, 1 = 일반 차선 추종 세기)
      handoff_stopline: 0.5    # 보행자 표지판을 본 뒤 정지선이 이 거리 안이면 CROSSWALK_STOP 으로 [m]
      handoff_sign: 1.0        # 정지선이 아직 안 보이면 표지판이 이 거리 안일 때 (0 = 끔) [m]
      max_duration: 20.0       # 보행자 표지판을 끝내 못 보면 이 시간 뒤 복귀

    # 미션 2 - 갈림길 A/B
    left_a_right_b:
      trigger_distance: 0.8
      approach_speed: 0.25
      shift_speed: 0.25
      lane_width: 0.50         # 트랙 도면 차선 폭 500 mm
      shift_duration: 2.5
      settle_sec: 1.0
      approach_timeout: 10.0
      max_duration: 20.0
      use_lane_context: true   # AVOID_STATIC 에서 이어받으면 odom 모드 (3차선 차선 번호 사용)
      a_lane: 0                # odom 모드: A(좌) 경로 차선 (0 왼쪽, 1 가운데, 2 오른쪽)
      b_lane: 2                # odom 모드: B(우) 경로 차선
      odom_hold_distance: 0.6  # 목표 차선 도착 후 이만큼 더 간 뒤 종료 [m]

    # 미션 7 - 정적 장애물 회피 (3차선, LIMO 7대). 차선 번호: 0 왼쪽, 1 가운데, 2 오른쪽
    avoid_static:
      trigger_distance: 1.2    # 라이다: 진행 경로 앞 이 거리 안 장애물이면 진입 [m]
      trigger_half_width: 0.3  # 진행 경로 폭의 절반 (옆에 선 주차 구역 LIMO 는 무시) [m]
      yolo_range: 1.5          # YOLO LIMO 는 이 거리 안 + 경로 폭 안일 때만 [m]
      lidar_trigger: true
      min_obstacle_radius: 0.10  # 라바콘(작음)과 구분 [m]
      max_obstacle_radius: 0.40
      start_lane: 1            # 3차선은 항상 가운데에서 시작
      lane_width: 0.52         # 차선 중앙 간격 (도면: 차선 500 + 점선 20 mm)
      speed: 0.25
      lookahead: 0.45          # 차선 따라가기 Pure Pursuit 거리 [m]
      plan_horizon: 1.8        # 후보 차선(가운데 3곳)마다 이 거리만큼 미리 굴려 보고 충돌 검사 [m]
      limo_length: 0.322       # 장애물 LIMO 박스 (진행방향 길이 x 폭) [m]
      limo_width: 0.22
      car_length: 0.322        # 우리 차
      car_width: 0.22
      clearance: 0.03          # 장애물 박스에 더하는 여유 [m]
      commit_distance: 0.9     # 고른 차선으로 이 거리도 못 가면 감속 [m]
      slow_speed: 0.10         # 그때 감속 속도
      stop_distance: 0.25      # 그래도 이 거리 안에서 닿게 되면 정지하고 기다림 [m]
      settle_tolerance: 0.08   # 목표 차선 중앙 +- 이 안이면 변경 완료 [m]
      settle_heading: 0.20     # ... 그리고 방향 오차가 이 안 [rad]
      merge_distance: 0.20
      confirm_hits: 2
      exit_clear_distance: 0.8 # 마지막 장애물을 지나 이만큼 더 가면 종료 [m]
      max_distance: 7.0        # 진입 후 최대 주행거리 (3차선 직선 5.5 m) [m]
      max_duration: 40.0
      context_timeout: 5.0     # 끝난 뒤 이 시간 안에 A/B 가 오면 차선 번호를 넘겨줌 [s]
      gap_speed: 0.12          # odom 이 없을 때만 쓰는 비상 주행 (빈 공간 따라가기)
      gap_range: 1.5
      gap_gain: 1.0
      robot_width: 0.30

    # 미션 8 - 라바콘
    cone:
      speed: 0.25
      creep_speed: 0.10
      lookahead: 0.45          # 게이트 중점을 이은 선 위에서 이만큼 앞 점을 따라감 [m]
      curve_gain: 0.35
      roi_min_x: 0.05
      roi_max_x: 2.0
      roi_max_y: 1.0
      max_radius: 0.18
      pair_max_dx: 0.45
      pair_max_angle_deg: 45.0   # 게이트 두 콘을 이은 선이 차 옆방향에서 이만큼 넘게 틀어지면 같은 줄 콘으로 봄
      min_gate_width: 0.30
      side_offset: 0.22
      robot_width: 0.22
      max_duration: 40.0
      # 미리 굴려보기 (11/02): 게이트 길을 옆으로 옮긴 후보들을 굴려서 차 몸통이 콘에 안 닿는 것 중 가운데에 가까운 것
      use_rollout: true          # false = 예전 방식 (게이트 선 위 lookahead 점 Pure Pursuit)
      horizon: 1.0               # 굴려보는 거리 [m]
      offset_max: 0.16           # 길을 옆으로 옮겨 보는 최대 [m]
      offset_step: 0.04          # 옮기는 간격 [m]
      car_length: 0.322          # 검사하는 차 몸통 (실차 LIMO)
      car_width: 0.22
      clearance: 0.02            # 라이다 콘 반지름에 더하는 여유 [m]
      w_offset: 1.0              # 길을 옆으로 옮긴 만큼 벌점 (가운데 선호)
      w_margin: 1.0              # 콘과 여유 보너스 (margin_cap 까지)
      margin_cap: 0.10
      steer_rate_deg: 0.0        # 바퀴 조향 속도 흉내 [도/s]. 0 = 바로 바뀜 (실차 실측 전)
      memory_merge: 0.10         # 같은 콘으로 볼 거리 [m]
      memory_behind: 0.6         # 차 뒤로 이만큼 지나간 콘은 잊음 [m]
      # 게이트를 못 만들 때(한쪽 콘만 보이거나 짝이 안 맞음): 많이 보이는 쪽 콘 2개 선과 평행 + 반폭 거리 유지
      side_use_rollout: true     # 한쪽 줄 -> 통로 반폭만큼 옮긴 가상 가운데 길을 미리 굴려보기로 따라감
                                 # false: 차선 따라가기식 조향 (side_kp_*)
      side_kp_lateral: 1.2       # 옆 오차 게인 (차선 주행과 같은 값)
      side_kp_heading: 0.8       # 방향 오차 게인
      side_half_width: 0.36      # 게이트를 한 번도 못 봤을 때 통로 반폭 [m] (보면 그 폭의 절반을 씀)
      side_max_step: 0.62        # 같은 줄 다음 콘으로 볼 최대 거리 [m]
      side_max_turn_deg: 60.0    # 같은 줄 다음 콘은 지금 줄 방향에서 이 각도 안 (건너편 콘은 거의 90도라 빠짐)
      pass_margin: 0.10          # 라이다에서 콘이 다 빠져도, 마지막 게이트 선을 앞바퀴가 이만큼 더 지날 때까지 구간 유지 [m]

    # 미션 4 - T자 주차 (2026: 진행방향 오른쪽 칸, 양옆 LIMO, 전면 진입)
    parking:
      search_speed: 0.15
      final_speed: 0.08
      min_speed: 0.04
      turn_speed: 0.10
      turn_radius: 0.50        # 계획 회전반경. 실제 최소(실차 약 0.46 m)보다 조금 크게 [m]
      k_radial: 2.0            # 원호 오차 보정 게인
      bay_pitch: 0.52          # 칸 간격 (칸 500 + 선 20 mm)
      pitch_tolerance: 0.22    # LIMO 쌍 간격(2 x pitch) 허용 오차 [m]
      pair_d_tolerance: 0.25
      bay_d_min: -0.95         # 윗줄 칸 LIMO 만 보는 범위 (차선 중앙 기준, 왼쪽 +) [m]
      bay_d_max: -0.30
      park_depth: 0.57         # 차선 중앙 -> 칸 깊이 가운데 (차선 반폭 0.25 + 선 0.02 + 칸 반 0.30) [m]
      min_obstacle_radius: 0.05
      max_obstacle_radius: 0.40
      merge_distance: 0.20
      confirm_hits: 2
      gap_confirm: 3
      gap_match: 0.15
      slow_distance: 0.15      # 회전 시작점 이 거리 앞부터 final_speed [m]
      overshoot_tolerance: 0.04
      heading_tolerance: 0.05  # -90도에서 이 안이면 회전 끝 [rad]
      k_heading: 1.5
      k_lateral: 2.0
      k_long: 1.0
      stop_tolerance: 0.02
      search_timeout: 30.0
      search_distance: 6.0
      turn_timeout: 15.0
      align_timeout: 15.0

    debug:
      enabled: true            # 대회 때는 false

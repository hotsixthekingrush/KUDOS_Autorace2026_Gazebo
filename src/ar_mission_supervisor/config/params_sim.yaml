# Gazebo 시뮬레이터용 덮어쓰기 값.
# params.yaml 을 먼저 읽고, 여기 적힌 항목만 교체된다.
mission_supervisor:
  ros__parameters:
    use_sim_time: true

    wheel_base: 0.24          # Gazebo 모델 앞뒤 바퀴 x = +-0.12 (실차 0.2)
    max_steer: 0.5236         # Gazebo ackermann 플러그인 조향 한계 30도
    front_wheel_x: 0.12       # Gazebo 모델 앞바퀴 x
    cmd_angular_is_steering: true   # Gazebo 아커만 플러그인은 angular.z 를 조향각으로 씀 (11/02 녹화·플러그인 코드로 확인)

    # 주차 turn_radius(0.50)는 시뮬 최소회전반경(0.24 / tan(30도) = 0.416)보다 커서 그대로 씀

    # (11/03) Gazebo 조향 수정(팀원 dc84411) 뒤 녹화로 재보니 조향이 초당 약 55도 (예전 3.4도).
    # 그래서 11/02 임시 라바콘 설정(speed 0.10, max_duration 90, steer_rate_deg 3.4)은 지움 -> 실차 값 그대로.

    cone:
      # (11/04) Gazebo 차 충돌 상자가 좌우 0.31 m 라 (실차 0.22, Gazebo 파일은 안 고침) 시뮬에서만 판단도 0.31 로 검사
      car_width: 0.31
      # Gazebo 조향은 초당 약 55도 (11/03 녹화). 굴려볼 때 이걸 흉내 내면 콘 놓칠 때 더 나음 (11/04 계산)
      steer_rate_deg: 55.0

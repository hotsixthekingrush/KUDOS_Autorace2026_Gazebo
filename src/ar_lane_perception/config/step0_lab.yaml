# step0 + 실차 노란색(LAB). 거절 규칙 전부 끔 (기존 step0.yaml 과 같은 규칙 구성) + 차선 폭 실측(lane-rt-width).
# 쓰는 법: camera_perception.launch.py lane_extra:=<이 파일>   (Gazebo 는 lane_extra:=<이 파일>,<sim_lab.yaml>)
camera_perception_node:
  ros__parameters:
    # --- 거절 규칙: 전부 끔
    clean_enable: false
    white_enable: false
    guard_need_pair: false
    single_tol_m: 0.0
    fork_enable: false
    confirm_head_rad: 0.0
    predict_enable: false
    min_confidence: 0.0

    # --- 노란색: 실차에서 추출한 값 (LAB: L100-215, a118-142, b143-255)
    color_space: lab
    lab_l_min: 100
    lab_l_max: 215
    lab_a_min: 118
    lab_a_max: 142
    lab_b_min: 143
    lab_b_max: 255

    # --- 차선 폭 실측 / 고정 폭 (코드 기본값과 같음. 조정용으로 적어 둠)
    width_min_m: 0.40
    width_max_m: 0.95
    width_max_step_m: 0.03
    width_stale_sec: 30.0        # 실측 폭 기억 만료 시간 [s] (코드 기본 3.0)
    lane_width_default_m: 0.50   # (가) 실측 없음 / width_stale_sec 넘게 지남
    lane_width_corner_m: 0.0     # (나) 곡선 보정 끔 (0 = 기억한 실측 폭 그대로). 켜려면 0.75
    single_confidence: 0.5
    pair_return_rate_mps: 0.3    # 한 선 -> 두 선 전환 때만

    # --- 카메라 값: 실차 확정 (11/13, 직선 50 cm 차선이 0.51 m 로 재짐). Gazebo 는 sim_hls.yaml / sim_lab.yaml 이 시뮬 값으로 덮어씀
    focal_px: 489.6
    cam_height_m: 0.20
    cam_pitch_rad: 0.15
    center_x: 312          # 처음 시작할 때 좌/우 선을 가르는 기준 (영상 가운데)
    cam_x_m: 0.10          # 실차 미측정 (시뮬 값 그대로)
    y_top: 260             # 실차 탐색 줄 범위 (영상 줄 번호). Gazebo 는 sim_hls / sim_lab 이 320 / 470 으로 덮어씀
    y_bot: 405

    # --- 흔들림 줄이기 (lane-kalman). step0 은 predict_enable false 라 차 움직임(odom)이 없어 칼만이 예측을 못 한다
    #     (가제보 기록: 지연 1.2 프레임으로 기준 1 프레임 초과) -> 칼만은 끔. 전환 섞기(A)만 켬. 값은 safe3 과 같게 적어 둠
    transition_smooth: true
    transition_blend_sec: 0.2
    lane_filter: none
    kf_q_lat: 0.02
    kf_q_head: 0.3
    kf_r_lat: 0.06
    kf_r_head: 0.24
    kf_r_single_scale: 2.0
    kf_r_trans_scale: 2.0
    kf_gate: 9.21
    kf_reset_sec: 0.1
    side_vote: false
    side_confirm_sec: 0.1
